<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLFIT Suplementos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050a12;--card:#0d1a2e;--card2:#0a1525;--accent:#1e90ff;--accent2:#1570cc;--text:#e8f4ff;--muted:#6b8aad;--border:#1a3050;--green:#00c875}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding-bottom:90px;min-height:100vh}
header{background:#040d1a;border-bottom:2px solid var(--accent);padding:14px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:900;letter-spacing:2px;color:var(--accent)}.logo span{color:#fff}
.cart-btn{background:var(--accent);color:#fff;border:none;border-radius:50px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.cart-count{background:#04101e;color:var(--accent);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.admin-bar{background:#040d1a;border-bottom:1px solid var(--border);padding:7px 16px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.admin-toggle{background:#0d1a2e;border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:3px 12px;font-size:11px;cursor:pointer;transition:all .2s}
.admin-toggle.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.cat-block{margin:0 0 4px}
.cat-header{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#07121f;border-bottom:1px solid var(--border);cursor:pointer;position:sticky;top:52px;z-index:50}
.cat-icon{font-size:18px;width:28px;text-align:center}
.cat-name{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--accent)}
.cat-count{font-size:11px;color:var(--muted);margin-left:auto}
.cat-chevron{font-size:13px;color:var(--muted);transition:transform .25s;margin-left:6px}
.cat-block.closed .cat-chevron{transform:rotate(-90deg)}
.cat-block.closed .cat-list{display:none}
.item{background:var(--card);border-bottom:1px solid var(--border);overflow:hidden}
.item.open{background:#0f2040}
.item-row{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none}
.item-thumb{width:54px;height:54px;border-radius:10px;background:#071525;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;position:relative;border:1px solid var(--border)}
.item-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
.item-info{flex:1;min-width:0}
.item-brand{font-size:10px;color:var(--accent);font-weight:700;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
.item-name{font-size:13px;font-weight:700;line-height:1.2;margin-bottom:3px}
.item-shortdesc{font-size:11px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.item-price{font-size:14px;font-weight:900;color:var(--accent);white-space:nowrap}
.chevron{font-size:13px;color:var(--muted);transition:transform .25s}
.item.open .chevron{transform:rotate(180deg)}
.panel{max-height:0;overflow:hidden;transition:max-height .35s ease}
.item.open .panel{max-height:700px}
.panel-inner{padding:12px 14px 14px;background:#071525;border-top:1px solid var(--border)}
.sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:12px 0 6px}
.sec:first-child{margin-top:0}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.pill{background:#0d1a2e;border:1px solid var(--border);border-radius:20px;padding:4px 11px;font-size:11px;cursor:pointer;transition:all .15s;color:var(--text)}
.pill.sel{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.nut-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:4px}
.nut-table tr{border-bottom:1px solid var(--border)}
.nut-table td{padding:5px 3px;color:var(--text)}
.nut-table td:last-child{text-align:right;font-weight:700;color:var(--accent)}
.func-txt{font-size:12px;color:#8ab4d4;line-height:1.5;margin-bottom:8px}
.add-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px;font-size:12px;font-weight:800;cursor:pointer;text-transform:uppercase;margin-top:6px;letter-spacing:.5px}
.edit-field{width:100%;background:#040d1a;border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;padding:7px 9px;outline:none;margin-bottom:7px;resize:vertical;font-family:inherit}
.edit-field:focus{border-color:var(--accent)}
.edit-sec{display:none}
.admin-mode .edit-sec{display:block}
.save-btn{background:var(--green);color:#000;border:none;border-radius:9px;padding:9px;font-weight:700;font-size:12px;cursor:pointer;width:100%;margin-bottom:6px}
.photo-btn{background:#0a1525;color:var(--muted);border:1px solid var(--border);border-radius:9px;padding:8px;font-size:12px;cursor:pointer;width:100%;margin-bottom:10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:#0d1a2e;border-radius:22px 22px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:18px;animation:up .25s ease;border-top:2px solid var(--accent)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.handle{width:38px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.cart-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.ci-info{flex:1}.ci-name{font-size:12px;font-weight:700;color:var(--text)}.ci-flavor{font-size:11px;color:var(--muted)}.ci-price{font-size:13px;font-weight:900;color:var(--accent)}
.qty-ctrl{display:flex;align-items:center;gap:7px}
.qty-btn{background:#071525;border:1px solid var(--border);color:var(--text);width:26px;height:26px;border-radius:7px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-n{font-weight:700;font-size:13px;min-width:18px;text-align:center;color:var(--text)}
.cart-total{padding:14px 0 6px;display:flex;justify-content:space-between;font-size:17px;font-weight:900;color:var(--text)}
.cart-total span:last-child{color:var(--accent)}
.wa-btn{width:100%;background:#25D366;color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:7px}
.note-inp{width:100%;background:#071525;border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:12px;padding:9px 11px;outline:none;resize:none;margin-top:10px;font-family:inherit}
.empty-cart{text-align:center;padding:36px 0;color:var(--muted);font-size:13px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:9px 18px;border-radius:50px;font-weight:700;font-size:12px;z-index:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="logo">ALL<span>FIT</span></div>
  <button class="cart-btn" onclick="openCart()">🛒 Carrito <span class="cart-count" id="cartCount">0</span></button>
</header>
<div class="admin-bar">
  <button class="admin-toggle" id="adminToggle" onclick="toggleAdmin()">⚙️ Modo Admin</button>
  <span id="adminLabel">Activá para editar precios y fotos</span>
</div>

<div id="catalog"></div>

<div class="overlay" id="cartModal" onclick="closeCart(event)">
  <div class="sheet">
    <div class="handle"></div>
    <h2 style="font-size:17px;font-weight:900;margin-bottom:14px;color:var(--text)">🛒 Tu pedido</h2>
    <div id="cartItems"></div>
    <div id="cartTotal" class="cart-total" style="display:none"><span>Total</span><span id="totalAmt"></span></div>
    <textarea class="note-inp" id="orderNote" rows="2" placeholder="Aclaraciones (zona, horario...)"></textarea>
    <button class="wa-btn" onclick="sendWA()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Enviar pedido por WhatsApp
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WA='5493515146361';
const CATS=[
  {id:'proteinas',name:'Proteínas',icon:'🥛',ids:[1,3,7]},
  {id:'preentreno',name:'Pre-Entreno',icon:'⚡',ids:[4,9]},
  {id:'creatinas',name:'Creatinas',icon:'💪',ids:[5,8,10]},
  {id:'quemadores',name:'Quemadores',icon:'🔥',ids:[6]},
  {id:'recuperacion',name:'Recuperación',icon:'✨',ids:[11,14,15,16,17]},
  {id:'vitaminas',name:'Vitaminas',icon:'💊',ids:[2]},
  {id:'volumen',name:'Volumen',icon:'⚖️',ids:[12]},
  {id:'accesorios',name:'Accesorios',icon:'🥤',ids:[13]},
];
const DEF=[
  {id:1,name:'Proteína Hoch',brand:'Hoch',price:45800,emoji:'🥛',shortdesc:'Whey de alta calidad · 25g proteína',flavors:['Chocolate','Vainilla','Frutilla','Dulce de leche'],nutrition:'Proteínas | 25g\nCarbohidratos | 3g\nGrasas | 1.5g\nCalorías | 125kcal\nPorciones | 30',desc:'Ideal para recuperación muscular post-entreno y aumento de masa magra.',photo:''},
  {id:2,name:'Multivitamínico Star',brand:'Star Nutrition',price:21000,emoji:'💊',shortdesc:'Vitaminas y minerales esenciales',flavors:[],nutrition:'Vitamina C | 1000mg\nVitamina D | 1000UI\nZinc | 10mg\nHierro | 18mg',desc:'Cubre los requerimientos diarios de micronutrientes para rendimiento óptimo.',photo:''},
  {id:3,name:'Proteína Núcleo',brand:'Núcleo',price:32100,emoji:'🥛',shortdesc:'Whey con excelente perfil aminoacídico',flavors:['Chocolate','Vainilla','Cookies'],nutrition:'Proteínas | 24g\nCarbohidratos | 4g\nGrasas | 2g\nCalorías | 130kcal\nPorciones | 28',desc:'Alta biodisponibilidad. Ideal para síntesis muscular y recuperación.',photo:''},
  {id:4,name:'Pre-Entreno V8',brand:'Star Nutrition',price:30300,emoji:'⚡',shortdesc:'Energía, foco y bomba muscular',flavors:['Sandía','Limón','Tropical','Frutos rojos'],nutrition:'Cafeína | 200mg\nBeta-Alanina | 3.2g\nCreatina | 2g\nCitrulina | 4g',desc:'Fórmula de alto rendimiento para entrenamientos intensos. Activa a los 20 min.',photo:''},
  {id:5,name:'Creatina Star',brand:'Star Nutrition',price:23600,emoji:'💪',shortdesc:'Creatina monohidrato pura · 60 porciones',flavors:['Sin sabor','Limón'],nutrition:'Creatina monohidrato | 5g\nPorciones | 60',desc:'Aumenta fuerza, potencia y recuperación. La más estudiada del mercado.',photo:''},
  {id:6,name:'Thermogenix',brand:'Star Nutrition',price:26700,emoji:'🔥',shortdesc:'Quemador para pérdida de grasa',flavors:['Tropical','Limón'],nutrition:'Cafeína | 200mg\nL-Carnitina | 500mg\nTé verde | 300mg',desc:'Acelera el metabolismo y potencia la oxidación de grasas como fuente de energía.',photo:''},
  {id:7,name:'Proteína Star',brand:'Star Nutrition',price:45990,emoji:'🥛',shortdesc:'Whey concentrada con excelente sabor',flavors:['Chocolate','Vainilla','Frutilla','Banana'],nutrition:'Proteínas | 24g\nCarbohidratos | 5g\nGrasas | 2g\nCalorías | 135kcal\nPorciones | 30',desc:'Proteína de alta calidad. Ideal para ganancia muscular y recuperación.',photo:''},
  {id:8,name:'Creatina Hoch',brand:'Hoch',price:27500,emoji:'💪',shortdesc:'Creatina micronizada de máxima pureza',flavors:['Sin sabor'],nutrition:'Creatina micronizada | 5g\nPorciones | 60',desc:'Micronizada para mayor absorción. Aumenta rendimiento en ejercicio de alta intensidad.',photo:''},
  {id:9,name:'Pre-Entreno V8',brand:'Núcleo',price:28300,emoji:'⚡',shortdesc:'Energía y bomba muscular Núcleo',flavors:['Sandía','Mango','Tropical'],nutrition:'Cafeína | 180mg\nBeta-Alanina | 3g\nCitrulina | 4g',desc:'Pre-entreno completo para máximo rendimiento y concentración.',photo:''},
  {id:10,name:'Creatina Núcleo Fit',brand:'Núcleo',price:20500,emoji:'💪',shortdesc:'Creatina práctica para el día a día',flavors:['Sin sabor','Limón'],nutrition:'Creatina | 3g\nPorciones | 40',desc:'Opción accesible y efectiva para mejorar fuerza y resistencia muscular.',photo:''},
  {id:11,name:'Colágeno Star',brand:'Star Nutrition',price:20900,emoji:'✨',shortdesc:'Colágeno hidrolizado · articulaciones y piel',flavors:['Naranja','Frutos rojos','Sin sabor'],nutrition:'Colágeno hidrolizado | 10g\nVitamina C | 60mg\nPorciones | 30',desc:'Refuerza tejidos conectivos, cartílagos y mejora la salud de la piel.',photo:''},
  {id:12,name:'Ganador de Peso',brand:'Star Nutrition',price:28100,emoji:'⚖️',shortdesc:'Hipercalórico para ganar masa y peso',flavors:['Chocolate','Vainilla','Frutilla'],nutrition:'Proteínas | 30g\nCarbohidratos | 55g\nGrasas | 3g\nCalorías | 370kcal\nPorciones | 15',desc:'Ideal para personas con dificultad para subir de peso o en etapa de volumen.',photo:''},
  {id:13,name:'Shaker Everlast',brand:'Everlast',price:12900,emoji:'🥤',shortdesc:'700ml · compartimiento · libre de BPA',flavors:[],nutrition:'Capacidad | 700ml\nMaterial | Libre de BPA\nCompartimiento | Incluye',desc:'Shaker resistente con compartimiento para guardar suplementos o snacks.',photo:''},
  {id:14,name:'Colágeno Núcleo Fit',brand:'Núcleo',price:22650,emoji:'✨',shortdesc:'Colágeno para articulaciones y piel',flavors:['Naranja','Limón','Sin sabor'],nutrition:'Colágeno | 10g\nVitamina C | 50mg\nPorciones | 30',desc:'Fórmula para recuperación articular y cuidado de piel y tejidos.',photo:''},
  {id:15,name:'Citrato Magnesio Caps',brand:'Star Nutrition',price:17250,emoji:'🔋',shortdesc:'Magnesio en cápsulas · 60 porciones',flavors:[],nutrition:'Magnesio | 300mg\nPorciones | 60',desc:'Mejora calidad del sueño, reduce calambres y apoya la función muscular.',photo:''},
  {id:16,name:'Citrato Magnesio Polvo',brand:'Star Nutrition',price:26990,emoji:'🔋',shortdesc:'Magnesio en polvo de alta absorción',flavors:['Sin sabor','Limón'],nutrition:'Magnesio | 350mg\nPorciones | 30',desc:'Máxima absorción. Ideal para recuperación nocturna y calidad del sueño.',photo:''},
  {id:17,name:'Omega 3',brand:'Star Nutrition',price:28900,emoji:'🐟',shortdesc:'EPA + DHA · corazón y cerebro',flavors:[],nutrition:'EPA | 360mg\nDHA | 240mg\nPorciones | 60',desc:'Reduce inflamación, mejora salud cardiovascular y función cognitiva.',photo:''},
];
let products=JSON.parse(localStorage.getItem('allfit_blue')||'null')||DEF;
let cart=JSON.parse(localStorage.getItem('allfit_cart5')||'[]');
let adminMode=false;
const selFlavors={};
const catOpen={};
CATS.forEach(c=>catOpen[c.id]=true);
function sP(){localStorage.setItem('allfit_blue',JSON.stringify(products))}
function sC(){localStorage.setItem('allfit_cart5',JSON.stringify(cart))}
function fmt(p){return'$'+parseInt(p).toLocaleString('es-AR')}
function renderCatalog(){
  const el=document.getElementById('catalog');el.innerHTML='';
  CATS.forEach(cat=>{
    const prods=cat.ids.map(id=>products.find(p=>p.id===id)).filter(Boolean);
    const block=document.createElement('div');
    block.className='cat-block'+(catOpen[cat.id]?'':' closed');
    block.id='cat-'+cat.id;
    let itemsHTML='';
    prods.forEach(p=>{
      const img=p.photo?`<div class="item-thumb"><img src="${p.photo}" alt="${p.name}"></div>`:`<div class="item-thumb">${p.emoji}</div>`;
      const flHTML=p.flavors.length?`<div class="sec">🍫 Sabores</div><div class="pills" id="pills-${p.id}">${p.flavors.map(f=>`<span class="pill" onclick="selFl(${p.id},'${f}',this)">${f}</span>`).join('')}</div>`:'';
      const nutHTML=p.nutrition?`<div class="sec">📊 Info Nutricional</div><table class="nut-table">${p.nutrition.split('\n').map(r=>{const[l,v]=r.split('|').map(x=>x.trim());return l?`<tr><td>${l}</td><td>${v||''}</td></tr>`:''}).join('')}</table>`:'';
      const funcHTML=p.desc?`<div class="sec">💡 Función</div><div class="func-txt">${p.desc}</div>`:'';
      const editHTML=`<div class="edit-sec">
        <input type="file" id="ph-${p.id}" accept="image/*" onchange="upPhoto(${p.id})" style="display:none">
        <button class="photo-btn" onclick="document.getElementById('ph-${p.id}').click()">📷 Cambiar foto</button>
        <div class="sec">💰 Precio</div>
        <input class="edit-field" type="number" id="ep-${p.id}" value="${p.price}">
        <div class="sec">🍫 Sabores (uno por línea)</div>
        <textarea class="edit-field" id="ef-${p.id}" rows="4">${p.flavors.join('\n')}</textarea>
        <div class="sec">📊 Info nutricional (Nombre | Valor)</div>
        <textarea class="edit-field" id="en-${p.id}" rows="5">${p.nutrition}</textarea>
        <div class="sec">💡 Función</div>
        <textarea class="edit-field" id="ed-${p.id}" rows="3">${p.desc}</textarea>
        <button class="save-btn" onclick="saveProd(${p.id})">✅ Guardar</button>
      </div>`;
      itemsHTML+=`<div class="item" id="item-${p.id}">
        <div class="item-row" onclick="toggleItem(${p.id})">
          ${img}
          <div class="item-info">
            <div class="item-brand">${p.brand}</div>
            <div class="item-name">${p.name}</div>
            <div class="item-shortdesc">${p.shortdesc}</div>
          </div>
          <div class="item-right">
            <div class="item-price">${fmt(p.price)}</div>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="panel"><div class="panel-inner">
          ${flHTML}${nutHTML}${funcHTML}${editHTML}
          <button class="add-btn" onclick="qAdd(${p.id})">+ Agregar al carrito</button>
        </div></div>
      </div>`;
    });
    block.innerHTML=`
      <div class="cat-header" onclick="toggleCat('${cat.id}')">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-name">${cat.name}</span>
        <span class="cat-count">${prods.length} producto${prods.length>1?'s':''}</span>
        <span class="cat-chevron">▾</span>
      </div>
      <div class="cat-list">${itemsHTML}</div>`;
    el.appendChild(block);
  });
}
function toggleCat(id){catOpen[id]=!catOpen[id];const b=document.getElementById('cat-'+id);b.classList.toggle('closed',!catOpen[id])}
function toggleItem(id){const item=document.getElementById('item-'+id);const wasOpen=item.classList.contains('open');document.querySelectorAll('.item.open').forEach(i=>i.classList.remove('open'));if(!wasOpen)item.classList.add('open')}
function selFl(id,fl,el){selFlavors[id]=fl;document.querySelectorAll('#pills-'+id+' .pill').forEach(p=>p.classList.remove('sel'));el.classList.add('sel')}
function qAdd(id){
  const p=products.find(x=>x.id===id);const fl=selFlavors[id]||'';
  if(p.flavors.length&&!fl){toast('Elegí un sabor primero');return}
  const key=p.id+'_'+fl;const ex=cart.find(x=>x.key===key);
  if(ex)ex.qty++;else cart.push({key,id:p.id,name:p.name,brand:p.brand,flavor:fl,price:p.price,qty:1});
  sC();updCount();toast('✅ '+p.name+(fl?' · '+fl:'')+' agregado');
}
function saveProd(id){
  const p=products.find(x=>x.id===id);
  p.price=parseInt(document.getElementById('ep-'+id).value)||p.price;
  p.flavors=document.getElementById('ef-'+id).value.split('\n').map(x=>x.trim()).filter(Boolean);
  p.nutrition=document.getElementById('en-'+id).value.trim();
  p.desc=document.getElementById('ed-'+id).value.trim();
  sP();renderCatalog();toast('✅ Guardado');
}
function upPhoto(id){
  const f=document.getElementById('ph-'+id).files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>{products.find(x=>x.id===id).photo=e.target.result;sP();renderCatalog();toast('📸 Foto actualizada')};
  r.readAsDataURL(f);
}
function toggleAdmin(){adminMode=!adminMode;document.getElementById('adminToggle').classList.toggle('active',adminMode);document.getElementById('adminLabel').textContent=adminMode?'✏️ Modo edición activo':'Activá para editar precios y fotos';document.body.classList.toggle('admin-mode',adminMode)}
function updCount(){document.getElementById('cartCount').textContent=cart.reduce((a,b)=>a+b.qty,0)}
function openCart(){renderCartItems();document.getElementById('cartModal').classList.add('open')}
function closeCart(e){if(e.target===document.getElementById('cartModal'))document.getElementById('cartModal').classList.remove('open')}
function renderCartItems(){
  const el=document.getElementById('cartItems'),tot=document.getElementById('cartTotal');el.innerHTML='';
  if(!cart.length){el.innerHTML='<div class="empty-cart">🛒 Tu carrito está vacío</div>';tot.style.display='none';return}
  let total=0;
  cart.forEach((item,i)=>{
    total+=item.price*item.qty;const d=document.createElement('div');d.className='cart-item';
    d.innerHTML=`<div class="ci-info"><div class="ci-name">${item.name}</div>${item.flavor?`<div class="ci-flavor">Sabor: ${item.flavor}</div>`:''}<div class="ci-price">${fmt(item.price*item.qty)}</div></div><div class="qty-ctrl"><button class="qty-btn" onclick="chQty(${i},-1)">−</button><span class="qty-n">${item.qty}</span><button class="qty-btn" onclick="chQty(${i},1)">+</button></div>`;
    el.appendChild(d);
  });
  tot.style.display='flex';document.getElementById('totalAmt').textContent=fmt(total);
}
function chQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);sC();updCount();renderCartItems()}
function sendWA(){
  if(!cart.length){toast('El carrito está vacío');return}
  const note=document.getElementById('orderNote').value.trim();
  let msg='🛍️ *Pedido ALLFIT*\n\n';let total=0;
  cart.forEach(item=>{total+=item.price*item.qty;msg+=`• ${item.qty}x *${item.name}*${item.flavor?` (${item.flavor})`:''} — ${fmt(item.price*item.qty)}\n`});
  msg+=`\n💰 *Total: ${fmt(total)}*`;if(note)msg+=`\n\n📝 *Aclaraciones:* ${note}`;
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,'_blank');
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
renderCatalog();updCount();
</script>
</body>
</html>
